<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de EStudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Diario de EStudio</h1>

    <!-- Las rachas se calculan solas con JavaScript -->
    <div class="rachas">
      <section class="tarjeta racha">
        <div class="fuego" aria-hidden="true">🔥</div>
        <div class="racha-numero" id="racha-numero">0</div>
        <div class="racha-texto">días seguidos estudiando</div>
      </section>

      <!-- La mejor racha usa todas las sesiones guardadas -->
      <section class="tarjeta racha record">
        <div class="fuego" aria-hidden="true">🏆</div>
        <div class="racha-numero" id="racha-mas-larga-numero">0</div>
        <div class="racha-texto">días seguidos (mejor racha)</div>
      </section>
    </div>

    <!-- Formulario para apuntar una sesión -->
    <section class="tarjeta">
      <h2>Nueva sesión</h2>
      <form id="formulario">
        <div class="campo">
          <label for="fecha">Fecha</label>
          <input type="date" id="fecha" name="fecha" required>
        </div>

        <div class="campo">
          <label for="tema">Tema</label>
          <input type="text" id="tema" name="tema" placeholder="¿Qué has estudiado?" required>
        </div>

        <div class="campo">
          <label for="minutos">Minutos</label>
          <input type="number" id="minutos" name="minutos" min="0" step="any" placeholder="Por ejemplo: 45" required>
        </div>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <!-- Lista de sesiones, de la más reciente a la más antigua -->
    <section class="tarjeta">
      <h2>Mis sesiones</h2>
      <ul id="lista" class="lista"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
